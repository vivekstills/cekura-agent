[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cekura-agent"
version = "0.1.0"
description = "Autonomous coding agent that integrates the Cekura SDK (monitoring, mock tools, dynamic variables, knowledge base) into LiveKit/Pipecat repos and reconciles Cekura platform state."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
cekura-agent = "cekura_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 (call in argument default) is the idiomatic typer CLI pattern.
"src/cekura_agent/cli.py" = ["B008"]
# fixture repos are scanner inputs, not executable code
"tests/fixtures/*" = ["F841"]
